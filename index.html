<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calculadora Visual</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="contenedor">

  <h2>Calculadora de Precio</h2>

<form id="formulario" class="formulario">
  <div class="campo">
    <label>Cantidad de item:</label>
    <input type="text" id="cantidad" name="cantidad">
  </div>

  <div class="campo">
    <label>Precio por item:</label>
    <input type="text" id="precio" name="precio">
  </div>

  <!-- <div class="campo">
    <label>Código de estado:</label>
    <input type="text" >
  </div> -->

  <div class="boton">
    <button type="submit" class="calcular" id="botonCalcular">Calcular</button>
  </div>
</form>



  <div class="resultados">
    <div class="resultado">
      <span>Precio neto :</span>
    </div>
    <!-- <div class="resultado">
      <span>Descuento :</span>
    </div>
    <div class="resultado">
      <span>Impuesto :</span>
    </div> -->
    <div class="resultado total">
      <span>Precio total: <span id="total">0</span></span>
    </div>
  </div>

</div>
  <script type="module" src="src/ventas/presenter-ventas.js"></script>
</body>
</html>
