<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Calculadora Visual</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<div class="contenedor">

<h2>Calculadora de Precio</h2>

<div class="formulario">
  <div class="campo">
    <label>Cantidad de item:</label>
    <input type="text" id="cantidad" name="cantidad">
  </div>

  <div class="campo">
    <label>Precio por item:</label>
    <input type="text" id="precio" name="precio">
  </div>

  <!-- <div class="campo">
    <label>Código de estado:</label>
    <input type="text" >
  </div> -->

  <div class="boton">
    <button class="calcular" >Calcular</button>
  </div>
</div>

<div class="resultados">
  <div class="resultado">
    <span>Precio neto :</span>
  </div>
  <!-- <div class="resultado">
    <span>Descuento :</span>
  </div>
  <div class="resultado">
    <span>Impuesto :</span>
  </div> -->
  <div class="resultado total">
    <span>Precio total: </span>
  </div>
</div>

</div>

</body>
</html>
